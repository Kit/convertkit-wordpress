name: Run Tests

# When to run tests.
on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

jobs:
  dependabot-metadata:
    uses: ./.github/workflows/_dependabot-metadata.yml
    secrets: inherit

  # Build the frontend CSS and JS assets once, for every job in the test matrix to use.
  build-assets:
    name: Build Assets

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      # npm ci is used instead of npm install, to install the versions defined in package-lock.json.
      - name: Run npm
        run: |
          npm ci
          npm run build

      - name: Upload Built Assets
        uses: actions/upload-artifact@v7
        with:
          name: plugin-assets
          retention-days: 1
          if-no-files-found: error
          path: |
            resources/frontend/css/frontend.css
            resources/frontend/js/dist/

  tests:
    name: ${{ matrix.group.path }} / WordPress ${{ matrix.wp-version }} / PHP ${{ matrix.php-version }}

    needs: [dependabot-metadata, build-assets]

    # Always allow non-Dependabot PRs and pushes.
    # For Dependabot PRs, only run when the update is for composer (skip github-actions updates).
    if: |
      always() &&
      (
        github.actor != 'dependabot[bot]' ||
        needs.dependabot-metadata.outputs.package-ecosystem == 'composer'
      )

    strategy:
      fail-fast: false
      matrix:
        wp-version: [ 'latest' ]
        php-version: [ '8.2', '8.3', '8.4', '8.5' ]
        # Each test group installs only the third party Plugins and Themes its tests activate,
        # rather than every job in the matrix installing all of them.
        group:
          - { path: 'EndToEnd/broadcasts/blocks-shortcodes', plugins: 'classic-editor', paid-plugins: 'false' }
          - { path: 'EndToEnd/broadcasts/import-export', plugins: 'classic-editor custom-post-type-ui wp-crontrol', paid-plugins: 'false' }
          - { path: 'EndToEnd/forms/blocks-shortcodes', plugins: 'block-visibility classic-editor autoptimize debloat jetpack-boost litespeed-cache sg-cachepress', plugins-urls: 'http://cktestplugins.wpengine.com/wp-content/uploads/2024/11/disable-doing-it-wrong-notices.zip', paid-plugins: 'true' }
          - { path: 'EndToEnd/forms/general', plugins: 'classic-editor', paid-plugins: 'false' }
          - { path: 'EndToEnd/forms/post-types', plugins: 'classic-editor custom-post-type-ui autoptimize debloat jetpack-boost litespeed-cache sg-cachepress', plugins-urls: 'http://cktestplugins.wpengine.com/wp-content/uploads/2024/11/disable-doing-it-wrong-notices.zip', paid-plugins: 'true' }
          - { path: 'EndToEnd/general/other', plugins: 'classic-editor custom-post-type-ui', plugins-urls: 'https://downloads.wordpress.org/plugin/convertkit-for-woocommerce.1.6.4.zip', paid-plugins: 'false' }
          - { path: 'EndToEnd/general/uninstall', paid-plugins: 'false' }
          - { path: 'EndToEnd/general/plugin-screens', plugins: 'admin-menu-editor custom-post-type-ui mailchimp-for-wp', paid-plugins: 'false' }
          - { path: 'EndToEnd/integrations/divi-builder', plugins: 'classic-editor', plugins-urls: 'http://cktestplugins.wpengine.com/wp-content/uploads/2024/11/disable-doing-it-wrong-notices.zip', paid-plugins: 'true' }
          - { path: 'EndToEnd/integrations/divi-theme', plugins: 'classic-editor', themes-urls: 'http://cktestplugins.wpengine.com/wp-content/uploads/2026/03/Divi_5.zip', paid-plugins: 'false' }
          - { path: 'EndToEnd/integrations/elementor', plugins: 'elementor', paid-plugins: 'false' }
          - { path: 'EndToEnd/integrations/other', plugins: 'akismet contact-form-7 forminator', paid-plugins: 'false' }
          - { path: 'EndToEnd/integrations/wlm', plugins-urls: 'http://cktestplugins.wpengine.com/wp-content/uploads/2024/11/disable-doing-it-wrong-notices.zip', paid-plugins: 'true' }
          - { path: 'EndToEnd/integrations/woocommerce', plugins: 'classic-editor woocommerce', plugins-urls: 'http://cktestplugins.wpengine.com/wp-content/uploads/2024/11/disable-doing-it-wrong-notices.zip', paid-plugins: 'false' }
          - { path: 'EndToEnd/landing-pages', plugins: 'admin-menu-editor autoptimize classic-editor rocket-lazy-load', plugins-urls: 'http://cktestplugins.wpengine.com/wp-content/uploads/2024/11/disable-doing-it-wrong-notices.zip', paid-plugins: 'true' }
          - { path: 'EndToEnd/products', plugins: 'classic-editor', paid-plugins: 'false' }
          - { path: 'EndToEnd/restrict-content/blocks-shortcodes', plugins: 'classic-editor', paid-plugins: 'false' }
          - { path: 'EndToEnd/restrict-content/general', plugins: 'admin-menu-editor custom-post-type-ui litespeed-cache sg-cachepress w3-total-cache wp-fastest-cache wp-optimize wp-super-cache', plugins-urls: 'http://cktestplugins.wpengine.com/wp-content/uploads/2024/11/disable-doing-it-wrong-notices.zip', paid-plugins: 'true' }
          - { path: 'EndToEnd/restrict-content/post-types', plugins: 'beaver-builder-lite-version custom-post-type-ui', plugins-urls: 'http://cktestplugins.wpengine.com/wp-content/uploads/2024/01/convertkit-action-filter-tests.zip http://cktestplugins.wpengine.com/wp-content/uploads/2024/11/disable-doing-it-wrong-notices.zip http://cktestplugins.wpengine.com/wp-content/uploads/2025/03/uncode-js_composer.7.8.zip http://cktestplugins.wpengine.com/wp-content/uploads/2025/03/uncode-core.zip', themes-urls: 'http://cktestplugins.wpengine.com/wp-content/uploads/2025/03/uncode.zip http://cktestplugins.wpengine.com/wp-content/uploads/2026/01/impeka.zip', paid-plugins: 'false' }
          - { path: 'EndToEnd/tags', plugins: 'classic-editor', paid-plugins: 'false' }
          - { path: 'Integration', paid-plugins: 'false' }

    uses: ./.github/workflows/_run-tests.yml
    secrets: inherit
    with:
      wp-version: ${{ matrix.wp-version }}
      php-version: ${{ matrix.php-version }}
      test-group: ${{ matrix.group.path }}
      block-editor-v3-enabled: 'true'
      db-sql-dump-file: 'tests/Support/Data/dump.sql'
      install-plugins: ${{ matrix.group.plugins }}
      install-plugins-urls: ${{ matrix.group.plugins-urls }}
      install-themes-urls: ${{ matrix.group.themes-urls }}
      install-paid-plugins: ${{ matrix.group.paid-plugins }}

  build-and-deploy:
    name: WordPress Playground

    # Require the dependabot-metadata and tests workflows to have run successfully.
    needs: [dependabot-metadata, tests]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      needs.tests.result == 'success' &&
      (
        github.actor != 'dependabot[bot]' ||
        needs.dependabot-metadata.outputs.package-ecosystem == 'composer'
      )

    # Virtual Environment to use.
    # @see: https://github.com/actions/virtual-environments
    runs-on: ubuntu-latest

    # Define permissions for this action.
    permissions:
      id-token: write
      contents: write
      pull-requests: write

    # Environment Variables.
    # Accessible by using ${{ env.NAME }}
    # Use ${{ secrets.NAME }} to include any GitHub Secrets in ${{ env.NAME }}
    # The base folder will always be /home/runner/work/github-repo-name/github-repo-name
    env:
      PLUGIN_SLUG: "convertkit" # The plugin's slug
      AWS_ROLE: "arn:aws:iam::048876701201:role/KitWPPluginBuildsRole"
      AWS_ROLE_SESSION_NAME: "kit-wordpress"
      AWS_BUCKET: "048876701201-kit-wp-plugin-builds" # The Amazon S3 bucket name
      AWS_REGION: "us-east-2" # The Amazon S3 region
      CONVERTKIT_API_KEY: ${{ secrets.CONVERTKIT_API_KEY }} # ConvertKit API Key, stored in the repository's Settings > Secrets
      CONVERTKIT_API_SECRET: ${{ secrets.CONVERTKIT_API_SECRET }} # ConvertKit API Secret, stored in the repository's Settings > Secrets
      CONVERTKIT_OAUTH_CLIENT_ID: ${{ secrets.CONVERTKIT_OAUTH_CLIENT_ID }}
      CONVERTKIT_OAUTH_REDIRECT_URI: ${{ secrets.CONVERTKIT_OAUTH_REDIRECT_URI }}

    # Steps to build and provide the Playground URL
    steps:
      # Checkout (copy) this repository's Plugin to this VM.
      - name: Checkout Plugin
        uses: actions/checkout@v7

      # Installs Kit WordPress Libraries.
      - name: Run Composer
        run: composer install --no-dev

      # Build the frontend CSS and JS assets.
      - name: Run npm
        run: |
          npm ci
          npm run build

      # Configure AWS Credentials
      - name: Configure AWS credentials
        id: credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          role-session-name: ${{ env.AWS_ROLE_SESSION_NAME }}
          aws-region: ${{ env.AWS_REGION }}

      # Create ZIP file
      - name: Create ZIP File
        run: |
          zip -r ${{ env.PLUGIN_SLUG }}.zip . -x ".git/*" ".github/*" ".scripts/*" ".wordpress-org/*" "log/*" "node_modules/*" "tests/*" "*.md" "*.yml" "*.json" "*.neon" "*.lock" "*.xml" "*.dist" ".eslintrc.js" "*.example" "*.testing" "vendor/convertkit/convertkit-wordpress-libraries/.git/*"

      # Exchange API Keys and Secrets for OAuth Tokens.
      - name: Exchange API Key and Secret for OAuth Tokens
        id: get-oauth-tokens
        run: |
          response=$(curl -s -X POST "${{ secrets.CONVERTKIT_EXCHANGE_API_KEYS_ENDPOINT }}?api_key=${{ env.CONVERTKIT_API_KEY }}&api_secret=${{ env.CONVERTKIT_API_SECRET }}&client_id=${{ env.CONVERTKIT_OAUTH_CLIENT_ID }}&redirect_uri=${{ env.CONVERTKIT_OAUTH_REDIRECT_URI }}&tenant_name=github-playground-${{ github.event.pull_request.number }}")
          access_token=$(echo "$response" | jq -r '.oauth.access_token')
          refresh_token=$(echo "$response" | jq -r '.oauth.refresh_token')
          echo "CONVERTKIT_OAUTH_ACCESS_TOKEN=$access_token" >> $GITHUB_ENV
          echo "CONVERTKIT_OAUTH_REFRESH_TOKEN=$refresh_token" >> $GITHUB_ENV

      # Create base64 encoded version of blueprint JSON for Playground URL.
      # See: https://wordpress.github.io/wordpress-playground/blueprints/using-blueprints#base64-encoded-blueprints
      - name: Create Blueprint JSON, Base64 Encoded
        id: blueprint
        run: |
          echo "blueprint_json_base64=$(echo -n '{"landingPage":"/wp-admin/index.php","login":true,"features":{"networking":true},"steps":[{"step":"setSiteOptions","options":{"_wp_convertkit_settings":{"access_token":"${{ env.CONVERTKIT_OAUTH_ACCESS_TOKEN }}","refresh_token":"${{ env.CONVERTKIT_OAUTH_REFRESH_TOKEN }}"}}},{"step":"installPlugin","pluginData":{"resource":"url","url":"https://${{ env.AWS_BUCKET }}.s3.${{ env.AWS_REGION }}.amazonaws.com/${{ env.PLUGIN_SLUG }}/${{ github.event.pull_request.number }}/${{ env.PLUGIN_SLUG }}.zip"}}]}' | base64 -w 0)" >> $GITHUB_OUTPUT

      # Upload to S3
      - name: Upload to S3
        id: upload-s3
        run: |
          aws s3 cp ${{ env.PLUGIN_SLUG }}.zip s3://${{ env.AWS_BUCKET }}/${{ env.PLUGIN_SLUG }}/${{ github.event.pull_request.number }}/${{ env.PLUGIN_SLUG }}.zip

      # Add comment to PR linking to Playground
      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## WordPress Playground

              :rocket: Your PR has been built and is ready for testing in WordPress Playground!

              [Click here to test your changes in WordPress Playground](https://playground.wordpress.net/#${{ steps.blueprint.outputs.blueprint_json_base64 }})`
            })
