name: Coding Standards

# When to run tests.
on:
  pull_request:
    types:
      - opened
      - synchronize
  push:
    branches:
      - main

jobs:
  dependabot-metadata:
    uses: ./.github/workflows/_dependabot-metadata.yml
    secrets: inherit

  # PHP Coding Standards and static analysis.
  # No WordPress installation is needed, as PHPCS and PHPStan analyse the Plugin's source directly.
  php:
    name: PHP Coding Standards / PHP ${{ matrix.php-versions }}

    runs-on: ubuntu-latest

    needs: [dependabot-metadata]

    # Always allow non-Dependabot PRs and pushes.
    # For Dependabot PRs, only run when the update is for composer (skip github-actions updates).
    if: |
      always() &&
      (
        github.actor != 'dependabot[bot]' ||
        needs.dependabot-metadata.outputs.package-ecosystem == 'composer'
      )

    strategy:
      fail-fast: false
      matrix:
        php-versions: [ '7.2', '7.3', '7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5' ]

    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v7

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-versions }}
          coverage: none
          tools: cs2pr

      # Installs PHP CodeSniffer, PHPStan and anything else needed to analyse the Plugin.
      # jq is used to remove the wordpress/mcp-adapter package from composer.json, as it requires PHP 7.4+.
      # composer update is used, as the above edit puts composer.json out of sync with composer.lock.
      - name: Run Composer
        run: |
          jq 'del(.require."wordpress/mcp-adapter")' composer.json > composer.json.tmp && mv composer.json.tmp composer.json
          composer update

      - name: Run WordPress PHP Coding Standards on Tests
        if: ${{ contains('8.1 8.2 8.3 8.4', matrix.php-versions) }}
        run: php vendor/bin/phpcs -q --standard=phpcs.tests.xml --report=checkstyle ./tests | cs2pr

      - name: Run WordPress PHP Coding Standards
        run: php vendor/bin/phpcs -q --standard=phpcs.xml --report=checkstyle ./ | cs2pr

      - name: Run PHPStan Static Analysis
        run: php vendor/bin/phpstan analyse --memory-limit=1250M

  # CSS and JS Coding Standards.
  # These don't depend on the PHP version, so run once instead of once per PHP version.
  assets:
    name: CSS and JS Coding Standards

    runs-on: ubuntu-latest

    needs: [dependabot-metadata]

    if: |
      always() &&
      (
        github.actor != 'dependabot[bot]' ||
        needs.dependabot-metadata.outputs.package-ecosystem == 'composer'
      )

    steps:
      - name: Checkout Plugin
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Run npm
        run: npm ci

      - name: Run WordPress CSS Coding Standards
        run: npm run lint:css

      - name: Run WordPress JS Coding Standards
        run: npm run lint:js
